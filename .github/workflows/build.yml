name: Bygg APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK er forhåndsinstallert på ubuntu-runneren (ANDROID_SDK_ROOT satt,
      # lisenser godkjent), så vi bruker den direkte – egen setup-android trengs ikke.

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bygg debug-APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Last opp APK
        uses: actions/upload-artifact@v4
        with:
          name: tvkatalog-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
